apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mq-ldap-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mq-ldap
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mq-apps
          podSelector:
            matchLabels:
              mq-ldap-client: "true"
      ports:
        - protocol: TCP
          port: 3636
