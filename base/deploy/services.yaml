apiVersion: v1
kind: Service
metadata:
  name: mq-ldap
spec:
  selector:
    app.kubernetes.io/name: mq-ldap
  ports:
    - name: ldaps
      port: 636
      targetPort: ldaps
---
apiVersion: v1
kind: Service
metadata:
  name: mq-ldap-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mq-ldap
  ports:
    - name: ldaps
      port: 3636
      targetPort: ldaps
