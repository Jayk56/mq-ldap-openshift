apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deploy/serviceaccount.yaml
  - deploy/services.yaml
  - deploy/statefulset.yaml
  - deploy/networkpolicy.yaml
configMapGenerator:
  - name: mq-ldap-tools
    files:
      - directory.py=ldap/directory.py
      - tree.ldif=ldap/tree.ldif
      - check-tls.py=ldap/check-tls.py
      - start.py=ldap/start.py
