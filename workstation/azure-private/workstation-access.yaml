apiVersion: v1
kind: Service
metadata:
  name: mq-ldap-private
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  # Replace this example with the address range used by the workstation or its VPN.
  loadBalancerSourceRanges: [192.0.2.10/32]
  selector:
    app.kubernetes.io/name: mq-ldap
  ports:
    - name: ldaps
      port: 636
      targetPort: ldaps
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mq-ldap-workstation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mq-ldap
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            # Kustomize fills in the first address range from the service above.
            cidr: 192.0.2.10/32
      ports:
        - {protocol: TCP, port: 3636}
