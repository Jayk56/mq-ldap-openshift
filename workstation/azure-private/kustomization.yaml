apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - workstation-access.yaml
replacements:
  - source:
      kind: Service
      name: mq-ldap-private
      fieldPath: spec.loadBalancerSourceRanges.0
    targets:
      - select:
          kind: NetworkPolicy
          name: mq-ldap-workstation
        fieldPaths:
          - spec.ingress.0.from.0.ipBlock.cidr
