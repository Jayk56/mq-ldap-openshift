apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../workstation/azure-private
  - allow-tomcat.yaml
patches:
  - target:
      version: v1
      kind: Service
      name: mq-ldap-private
    patch: |-
      - op: add
        path: /spec/loadBalancerSourceRanges/-
        # Replace this example with the address range Tomcat uses to reach the load balancer.
        value: 198.51.100.20/32
replacements:
  - source:
      kind: Service
      name: mq-ldap-private
      fieldPath: spec.loadBalancerSourceRanges.1
    targets:
      - select: {kind: NetworkPolicy, name: mq-ldap-remote-tomcat}
        fieldPaths: [spec.ingress.0.from.0.ipBlock.cidr]
